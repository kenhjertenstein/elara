<style>
  :root{
    --stone-0:#050506;
    --stone-1:#0A0B0D;
    --stone-2:#111214;
    --ink:#FFFFFF;
    --ink-2:rgba(255,255,255,.66);
    --ink-3:rgba(255,255,255,.40);
    --ink-4:rgba(255,255,255,.22);
    --line:rgba(255,255,255,.09);
    --line-2:rgba(255,255,255,.055);
    --plat:#E8E4DC;
    --radius:20px;
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);
    font-synthesis-weight:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--stone-0);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;min-height:100dvh;
    overflow-x:hidden;
  }
  /* ---- polished black stone surface ---- */
  .stone{position:fixed;inset:0;z-index:-2;background:
    radial-gradient(120% 80% at 18% -10%, #202226 0%, rgba(32,34,38,0) 55%),
    radial-gradient(90% 70% at 92% 8%, #1A1C20 0%, rgba(26,28,32,0) 60%),
    radial-gradient(140% 120% at 50% 120%, #101114 0%, rgba(16,17,20,0) 60%),
    linear-gradient(168deg,#0E0F12 0%,#08090A 42%,#050506 100%);
  }
  .stone::after{content:"";position:absolute;inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.55'/></svg>");
    opacity:.05;mix-blend-mode:overlay;}
  .sheen{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(58% 34% at 26% 0%, rgba(255,255,255,.085) 0%, rgba(255,255,255,0) 62%);}

  /* ---- typography helpers ---- */
  .lbl{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.025em}

  /* ---- slab / card ---- */
  .slab{
    position:relative;border-radius:var(--radius);
    background:linear-gradient(158deg,rgba(255,255,255,.062) 0%,rgba(255,255,255,.022) 46%,rgba(255,255,255,.012) 100%);
    border:1px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 24px 48px -28px rgba(0,0,0,.95);
    backdrop-filter:blur(2px);
  }
  .slab.flat{background:rgba(255,255,255,.028);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

  /* ---- lock screen ---- */
  #lock{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:32px;z-index:50}
  .mark{font-size:13px;letter-spacing:.46em;text-transform:uppercase;color:var(--ink);font-weight:600;padding-left:.46em}
  .mark-sub{font-size:11px;letter-spacing:.24em;color:var(--ink-4);text-transform:uppercase;margin-top:10px;text-align:center}
  .monolith{width:74px;height:104px;border-radius:8px;
    background:linear-gradient(155deg,#2B2E33 0%,#141519 40%,#0A0B0D 100%);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset -12px 0 24px -18px rgba(255,255,255,.3), 0 30px 60px -20px rgba(0,0,0,1);
    position:relative;overflow:hidden}
  .monolith::after{content:"";position:absolute;top:-30%;left:-40%;width:70%;height:190%;transform:rotate(18deg);
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.14),rgba(255,255,255,0))}
  .pwwrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
  input[type=password],input[type=text]{
    width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
    background:rgba(255,255,255,.045);color:var(--ink);font-size:16px;font-family:inherit;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07);outline:none;transition:border-color .18s,background .18s}
  input:focus{border-color:rgba(255,255,255,.30);background:rgba(255,255,255,.07)}
  button.primary{
    padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.07));
    color:var(--ink);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22);transition:transform .12s,filter .18s}
  button.primary:active{transform:scale(.985);filter:brightness(1.15)}
  #lockmsg{font-size:13px;color:#E0A0A0;min-height:18px;text-align:center}

  /* ---- app shell ---- */
  #app{display:none;padding:calc(var(--safe-t) + 18px) 18px calc(96px + var(--safe-b));max-width:720px;margin:0 auto}
  header.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
  header.top .mark{font-size:12px;letter-spacing:.42em}
  header.top .date{font-size:12px;color:var(--ink-3);letter-spacing:.04em}

  section.view{display:none;animation:fade .28s ease}
  section.view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .hero{padding:22px 20px 20px;margin-bottom:14px}
  .hero .wd{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
  .hero .dt{font-size:13px;color:var(--ink-3);margin-top:4px}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .chip{font-size:11.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.045);color:var(--ink-2);letter-spacing:.02em;white-space:nowrap}
  .chip.hot{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:var(--ink)}

  .card{padding:18px 18px 16px;margin-bottom:14px}
  .card .lbl{margin-bottom:12px;display:block}
  .big{font-size:23px;font-weight:600;letter-spacing:-.028em;line-height:1.2}
  .sub{font-size:13.5px;color:var(--ink-2);margin-top:6px}
  .meta{font-size:12px;color:var(--ink-3);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
  a.link{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}

  .rows{display:flex;flex-direction:column}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line-2)}
  .row:first-child{border-top:none}
  .row .k{font-size:13px;color:var(--ink-3);min-width:78px}
  .row .v{font-size:14.5px;color:var(--ink);text-align:right;flex:1}
  .row.next{margin:0 -12px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.06);border-top-color:transparent}
  .row.next .k{color:var(--ink-2)}
  .row.muted .v{color:var(--ink-4)}

  .daylist{display:flex;flex-direction:column;gap:8px}
  .day{display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:14px;
    border:1px solid var(--line-2);background:rgba(255,255,255,.022)}
  .day.today{border-color:rgba(255,255,255,.26);background:rgba(255,255,255,.075);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
  .day .d{font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);width:34px;font-weight:600}
  .day.today .d{color:var(--ink)}
  .day .f{font-size:14.5px;flex:1}
  .day .t{font-size:11.5px;color:var(--ink-4);font-variant-numeric:tabular-nums}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:15px 15px 14px;border-radius:15px;border:1px solid var(--line-2);background:rgba(255,255,255,.026)}
  .stat .n{font-size:25px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .stat .c{font-size:11px;color:var(--ink-3);margin-top:3px;letter-spacing:.03em}

/* ---------- storage that can never throw ---------- */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v===null? (k in mem? mem[k]:null) : v; }catch(e){ return k in mem? mem[k]:null; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ---------- crypto ---------- */
async function decryptPayload(b64, pw){
  const raw = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const salt = raw.slice(0,16), iv = raw.slice(16,28), data = raw.slice(28);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = new Intl.NumberFormat('sv-SE');
function money(n){
  if(n===null||n===undefined) return '–';
  if(n>=1000000) { const m=n/1000000; return (m%1===0? m : m.toFixed(1).replace('.',',')) + ' mkr'; }
  if(n>=1000) return nf.format(Math.round(n/1000)) + 'k';
  return nf.format(n);
}
function daysBetween(a,b){ return Math.ceil((b-a)/86400000); }
function parseNum(s){ const v = String(s).replace(/[^\d]/g,''); return v===''? 0 : parseInt(v,10); }

let D = null;                       // decrypted data
const now = new Date();
const dowIdx = (now.getDay()+6)%7;  // 0 = måndag

function currentPhase(){
  const t = now.getTime();
  for(const p of D.training.phases){
    if(t >= Date.parse(p.from) && t <= Date.parse(p.to)+86399000) return p;
  }
  return D.training.phases[D.training.phases.length-1];
}

/* ---------- views ---------- */

    ['Mellis',  meal.mellis,  15],
    ['Middag',  meal.middag,  18.5],
    ['Efterrätt', meal.efterratt, 20]
  ];
  const hour = now.getHours() + now.getMinutes()/60;

  $('#v-idag').innerHTML = `
    <div class="slab hero">
      <div class="wd">${esc(wd)}</div>
      <div class="dt">${esc(dt)}</div>
      <div class="chiprow">
        <span class="chip ${day.gym?'hot':''}">${day.gym? esc(D.training.time) : 'Vilodag'}</span>
        <span class="chip">${esc(ph.label)}</span>
        <span class="chip">${dleft > 0 ? dleft + ' dagar till 3-månadersmålen' : '3-månadersmålen förfallna'}</span>
      </div>
    </div>
    ${trainingCard}
    <div class="slab card">
      <span class="lbl">Dagens mat</span>
      <div class="rows">
        ${meals.map((m,i)=>{
          const off = !m[1] || m[1]==='Ingen' || m[1]==='Nej';
          return `<div class="row ${i===nextIdx?'next':''} ${off?'muted':''}">
            <span class="k">${esc(m[0])}</span><span class="v">${esc(m[1]||'–')}</span></div>`;
        }).join('')}
      </div>
    </div>`;
}

function renderTraning(){
  const ph = currentPhase();
  const gymDays = D.training.week.filter(d=>d.gym).length;
  $('#v-traning').innerHTML = `
    <div class="slab card">
      <span class="lbl">Veckan</span>
      <div class="daylist">
        ${D.training.week.map((d,i)=>`
          <div class="day ${i===dowIdx?'today':''}">
            <span class="d">${esc(d.short)}</span>
            <span class="f">${esc(d.focus)}</span>
            <span class="t">${d.gym? esc(D.training.time):'—'}</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="slab stat"><div class="n num">${gymDays}</div><div class="c">gympass i veckan</div></div>
      <div class="slab stat"><div class="n num">${esc(ph.warmup.split(' ')[0])}</div><div class="c">min uppvärmning nu</div></div>
    </div>
    <div class="slab card">
      <span class="lbl">Upptrappning</span>
      <div class="rows">
        ${D.training.phases.map(p=>`
          <div class="row ${p.id===ph.id?'next':''}">
            <span class="k">${esc(p.label)}</span>
            <span class="v">${esc(p.warmup)}</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="slab card">
      <span class="lbl">Lokal</span>
      <div class="big" style="font-size:19px">${esc(D.training.gym)}</div>
      <div class="sub">${esc(D.training.address)}</div>
      <div class="meta"><a class="link" target="_blank" rel="noopener"
        href="https://maps.apple.com/?q=${encodeURIComponent(D.training.gym+' '+D.training.address)}">Öppna i kartor</a></div>
    </div>`;
}

function renderKost(){
  $('#v-kost').innerHTML = `
    <div class="slab card">
      <span class="lbl">Principer</span>
      <div class="rows">
        ${D.food.rules.map(r=>`<div class="row"><span class="v" style="text-align:left;font-size:14px;color:var(--ink-2)">${esc(r)}</span></div>`).join('')}
      </div>
    </div>
    ${D.food.week.map((m,i)=>`
      <div class="slab card" style="${i===dowIdx?'border-color:rgba(255,255,255,.26)':''}">
        <span class="lbl">${esc(m.day)}${i===dowIdx?' · idag':''}</span>
        <div class="rows">
          <div class="row"><span class="k">Frukost</span><span class="v">${esc(m.frukost)}</span></div>
          <div class="row"><span class="k">Lunch</span><span class="v">${esc(m.lunch)}</span></div>
          <div class="row"><span class="k">Mellis</span><span class="v">${esc(m.mellis)}</span></div>
          <div class="row"><span class="k">Middag</span><span class="v">${esc(m.middag)}</span></div>
          <div class="row"><span class="k">Efterrätt</span><span class="v">${esc(m.efterratt)}</span></div>
        </div>
      </div>`).join('')}`;
}

function goalHTML(g){
  const cur = parseNum(store.get('goal_'+g.id) ?? g.current);
  const pct = g.target? Math.min(100, Math.round(cur/g.target*100)) : 0;
  return `<div class="goal">
    <div class="gt">
      <span class="gl">${esc(g.label)}</span>
      <span class="gv">${money(cur)} / ${money(g.target)}</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <input type="text" inputmode="numeric" data-goal="${esc(g.id)}" value="${cur? nf.format(cur):''}"
      placeholder="Var är du nu? (${esc(g.unit)})">
  </div>`;
}

function renderMal(){
  const which = store.get('goalview') || 'short';
  const list = which==='short'? D.goals.short : D.goals.long;
  const dl = new Date(which==='short'? D.goals.shortDeadline : D.goals.longDeadline);
  const dleft = daysBetween(now, dl);
  const groups = [...new Set(list.map(g=>g.group))];

  $('#v-mal').innerHTML = `
    <div class="seg">
      <button data-g="short" class="${which==='short'?'on':''}">3 månader</button>
      <button data-g="long" class="${which==='long'?'on':''}">3 år</button>
    </div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="slab stat"><div class="n num">${dleft>0?dleft:0}</div><div class="c">dagar kvar</div></div>
      <div class="slab stat"><div class="n num">${list.length}</div><div class="c">mål i sikte</div></div>
    </div>
    ${groups.map(gr=>`
      <div class="slab card">
        <span class="lbl">${esc(gr)}</span>
        ${list.filter(g=>g.group===gr).map(goalHTML).join('')}
      </div>`).join('')}
    <div class="slab card">
      <span class="lbl">Bolagen</span>
      ${D.companies.map(c=>`
        <div class="comp">
          <div class="cn">${esc(c.name)}</div>
          <div class="ct">${esc(c.tag)}</div>
          <div class="rows" style="margin-top:10px">
            <div class="row"><span class="k">3 mån</span><span class="v">${c.short.revenue!==null? money(c.short.revenue)+' oms':''}${c.short.revenue!==null&&c.short.salary!==null?' · ':''}${c.short.salary!==null? money(c.short.salary)+'/mån lön':''}</span></div>
            <div class="row"><span class="k">3 år</span><span class="v">${money(c.long.revenue)} oms · ${money(c.long.salary)}/mån lön</span></div>
          </div>
        </div>`).join('')}
    </div>`;

  $('#v-mal').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ store.set('goalview', b.dataset.g); renderMal(); });
  $('#v-mal').querySelectorAll('input[data-goal]').forEach(inp=>{
    inp.onchange = ()=>{ store.set('goal_'+inp.dataset.goal, String(parseNum(inp.value))); renderMal(); };
  });
}

function renderLiv(){
  $('#v-liv').innerHTML = `
    <div class="slab card">
      <span class="lbl">Prioriteringar just nu</span>
      ${D.priorities.map(p=>`
        <div class="prio">
          <span class="r num">${p.rank}</span>
          <span><span class="pn">${esc(p.name)}</span>${p.note?`<div class="pd">${esc(p.note)}</div>`:''}</span>
        </div>`).join('')}
    </div>
    <div class="slab card">
      <span class="lbl">Det som gör livet bra</span>
      <div class="tags">${D.interests.map(i=>`<span class="chip">${esc(i)}</span>`).join('')}</div>
    </div>`;
}

/* ---------- boot ---------- */
function boot(){
  $('#lock').style.display='none';
  $('#app').style.display='block';
  $('#tabs').style.display='block';
  $('#topdate').textContent = now.toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short'});
  $('#ft').textContent = 'Uppdaterad ' + D.updated;
  renderIdag(); renderTraning(); renderKost(); renderMal(); renderLiv();
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on', x===b));
      document.querySelectorAll('section.view').forEach(s=>s.classList.toggle('on', s.id==='v-'+b.dataset.v));
      window.scrollTo({top:0,behavior:'instant'});
    };
  });
}

async function unlock(){
  const pw = $('#pw').value;
  if(!pw) return;
  const msg = $('#lockmsg');
  if(!(window.crypto && crypto.subtle)){ msg.textContent='Krypto-API saknas — öppna sidan över https.'; return; }
  msg.textContent = 'Låser upp…'; msg.style.color='var(--ink-3)';
  try{
    D = await decryptPayload(PAYLOAD, pw);
    boot();
  }catch(e){
    msg.style.color='#E0A0A0';
    msg.textContent = 'Fel lösenord.';
    $('#pw').value=''; $('#pw').focus();
  }
}
$('#go').onclick = unlock;
$('#pw').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
</script>
